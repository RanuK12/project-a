name: Weekly Bounty Scout

on:
  schedule:
    - cron: "47 0 * * 1" # Monday 07:47 WIB
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Scan GitHub for paid bounties
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m bounty_scout.scout --min-amount 10 --top 20 --output report.md
      - name: Publish report as an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create bounty-scout --color 0E8A16 --force
          gh issue create \
            --title "Bounty Scout — $(date -u +%F)" \
            --label bounty-scout \
            --body-file report.md
